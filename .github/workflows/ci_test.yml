name: CI Test

# Testes unitários do app (inclui o sync com o Suwayomi: failover de origens, contrato e merge).
on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Android SDK
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager "build-tools;35.0.0"

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.ref_name != github.event.repository.default_branch }}

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Run unit tests
        run: ./gradlew testStandardDebugUnitTest --stacktrace

      - name: Publish test report
        uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          include_passed: true
          detailed_summary: true
          report_paths: "**/build/test-results/test*/TEST-*.xml"

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results-${{ github.sha }}
          path: "**/build/reports/tests"
